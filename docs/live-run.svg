    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse"><path d="M54 0H0V54" fill="none" stroke="#b1d9d3" stroke-opacity=".045"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="920" rx="28" fill="url(#bg)"/><rect width="1600" height="920" rx="28" fill="url(#grid)"/>
