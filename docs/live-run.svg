    <rect x="1370" y="56" width="119" height="24" rx="12" fill="#182a23" stroke="#49694f"/><circle cx="1385" cy="68" r="4" fill="#c8fa77"/><text x="1397" y="72" fill="#c8fa77" font-family="monospace" font-size="9">LIVE STREAM</text>

