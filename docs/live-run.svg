    <text x="79" y="225" fill="#8e9da2" font-size="12">October 14, 2026  ·  4 research lenses  ·  risk debate</text>
    <text x="1351" y="179" fill="#5d6b70" font-family="monospace" font-size="9">PIPELINE</text><text x="1351" y="207" fill="#c8fa77" font-family="monospace" font-size="21">73%</text><text x="1351" y="225" fill="#5d6b70" font-size="9">9 / 12 nodes</text>
    <text x="1457" y="179" fill="#5d6b70" font-family="monospace" font-size="9">EVENTS</text><text x="1457" y="207" fill="#c8fa77" font-family="monospace" font-size="21">248</text><text x="1457" y="225" fill="#5d6b70" font-size="9">captured live</text>
    <path d="M79 251h1405" stroke="#27383c"/>

