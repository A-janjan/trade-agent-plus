<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">tradeagents live research run screen</title>
  <desc id="desc">A dashboard illustration of a live tradeagents run showing the decision path, streaming output, debate transcript, and final decision card.</desc>
  <defs>
