    <path d="M402 446h1056" stroke="#385344"/><text x="402" y="461" fill="#5d6b70" font-family="monospace" font-size="9">⌁ measuring…</text><text x="569" y="461" fill="#5d6b70" font-family="monospace" font-size="9">⌁ 248 stream events</text><text x="1291" y="461" fill="#68d7c1" font-family="monospace" font-size="9">EVIDENCE BEFORE CONVICTION</text>

    <rect x="378" y="496" width="1106" height="146" rx="14" fill="#0a1115" stroke="#273a3e"/>
    <path d="M378 541h1106" stroke="#273a3e"/><text x="402" y="524" fill="#8e9da2" font-family="monospace" font-size="10">●  LIVE NODE OUTPUT</text><text x="1362" y="524" fill="#68d7c1" font-family="monospace" font-size="9">⌁ Balanced Reviewer</text>
    <text x="402" y="567" fill="#849c98" font-family="monospace" font-size="10">The proposed sizing is supportable if the evidence remains asymmetric,</text><text x="402" y="588" fill="#849c98" font-family="monospace" font-size="10">but the committee should distinguish conviction from momentum… <tspan fill="#c8fa77">▋</tspan></text><text x="402" y="623" fill="#5d6b70" font-family="monospace" font-size="9">TAIL PREVIEW · UPDATES AS THE MODEL RESPONDS</text><text x="1358" y="623" fill="#5d6b70" font-family="monospace" font-size="9">1,642 characters</text>

    <text x="378" y="700" fill="#68d7c1" font-family="monospace" font-size="10" letter-spacing="1.4">ADVERSARIAL REVIEW</text><text x="378" y="734" fill="#f0f7f2" font-size="22" font-weight="600">The room challenges itself</text>
    <rect x="378" y="762" width="534" height="118" rx="12" fill="#11191d" stroke="#273a3e"/><rect x="942" y="762" width="542" height="118" rx="12" fill="#11191d" stroke="#273a3e"/>
    <circle cx="406" cy="790" r="15" fill="#213226"/><text x="399" y="796" fill="#c8fa77" font-size="14">✦</text><text x="433" y="790" fill="#f0f7f2" font-size="12" font-weight="600">Research debate</text><text x="433" y="808" fill="#5d6b70" font-size="9">Transcript · 4 contributions</text><text x="400" y="838" fill="#68d7c1" font-size="10">01  Upside Case</text><text x="400" y="858" fill="#849c98" font-size="10">The upside case still has room to compound…</text>
    <circle cx="970" cy="790" r="15" fill="#213226"/><text x="963" y="796" fill="#c8fa77" font-size="14">◇</text><text x="997" y="790" fill="#f0f7f2" font-size="12" font-weight="600">Risk debate</text><text x="997" y="808" fill="#5d6b70" font-size="9">Transcript · 6 contributions</text><text x="964" y="838" fill="#68d7c1" font-size="10">01  Growth Advocate</text><text x="964" y="858" fill="#849c98" font-size="10">The opportunity justifies measured exposure…</text>
