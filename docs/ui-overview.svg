<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">tradeagents web interface preview</title>
  <desc id="desc">A polished dark dashboard mockup of the tradeagents research workspace with a run form, evidence graph, and recent runs.</desc>
  <defs>
    <linearGradient id="page" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#080b0f"/><stop offset="1" stop-color="#121b20"/></linearGradient>
    <linearGradient id="button" x1="0" x2="1"><stop stop-color="#9ce36b"/><stop offset="1" stop-color="#d4fb82"/></linearGradient>
    <linearGradient id="chart" x1="0" x2="1"><stop stop-color="#65d7c3"/><stop offset="1" stop-color="#c8fa77"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
    <pattern id="grid" width="55" height="55" patternUnits="userSpaceOnUse"><path d="M55 0H0V55" fill="none" stroke="#bddfd5" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1600" height="1000" rx="30" fill="url(#page)"/>
  <rect width="1600" height="1000" rx="30" fill="url(#grid)"/>
  <circle cx="1260" cy="110" r="220" fill="#77d7b7" opacity=".08" filter="url(#soft)"/>
  <g font-family="Arial, sans-serif">
    <rect x="54" y="39" width="1492" height="64" rx="0" fill="#0b1115" fill-opacity=".8"/>
    <rect x="54" y="102" width="1492" height="1" fill="#26353a"/>
    <rect x="79" y="57" width="27" height="27" rx="8" fill="#c8fa77"/>
    <path d="m92 61 2 7 7 2-7 2-2 7-2-7-7-2 7-2 2-7Z" fill="#0b1109"/>
    <text x="118" y="76" fill="#f0f7f2" font-size="16" font-weight="700">trade<tspan fill="#c8fa77">agents</tspan></text>
    <text x="342" y="76" fill="#8e9da2" font-size="12">New run</text><text x="418" y="76" fill="#8e9da2" font-size="12">Method</text><text x="489" y="76" fill="#8e9da2" font-size="12">History</text>
    <circle cx="1390" cy="70" r="4" fill="#c8fa77"/><text x="1403" y="75" fill="#8e9da2" font-family="monospace" font-size="11">RESEARCH WORKSPACE</text>

    <text x="79" y="168" fill="#68d7c1" font-family="monospace" font-size="11" letter-spacing="2">MULTI-AGENT MARKET INTELLIGENCE</text>
    <text x="79" y="217" fill="#f0f7f2" font-size="48" font-weight="500">Make the next decision feel</text>
    <text x="79" y="267" fill="#c8fa77" font-size="48" font-weight="500">less like a guess.</text>
    <text x="79" y="310" fill="#8e9da2" font-size="15">A research room of independent analysts, adversarial debates,</text>
    <text x="79" y="333" fill="#8e9da2" font-size="15">and one accountable final call — streamed live.</text>
    <text x="79" y="391" fill="#f0f7f2" font-family="monospace" font-size="22">4</text><text x="79" y="412" fill="#5d6b70" font-size="10">research lenses</text>
    <text x="184" y="391" fill="#f0f7f2" font-family="monospace" font-size="22">2</text><text x="184" y="412" fill="#5d6b70" font-size="10">adversarial debates</text>
    <text x="306" y="391" fill="#f0f7f2" font-family="monospace" font-size="22">1</text><text x="306" y="412" fill="#5d6b70" font-size="10">auditable decision</text>

    <rect x="815" y="140" width="670" height="305" rx="16" fill="#11191d" stroke="#293c41"/>
    <text x="845" y="174" fill="#68d7c1" font-family="monospace" font-size="10" letter-spacing="1.8">NEW RESEARCH RUN</text>
    <text x="845" y="208" fill="#f0f7f2" font-size="20" font-weight="600">Set your point of view</text>
    <rect x="1349" y="165" width="100" height="25" rx="13" fill="#182b2a" stroke="#2c5e54"/><circle cx="1363" cy="177" r="3" fill="#69d7c1"/><text x="1372" y="181" fill="#69d7c1" font-family="monospace" font-size="9">LIVE STREAM</text>
    <text x="845" y="242" fill="#b7c6c6" font-size="11">Instrument</text><text x="1160" y="242" fill="#b7c6c6" font-size="11">Analysis date</text>
    <rect x="845" y="251" width="286" height="43" rx="8" fill="#0b1114" stroke="#33464a"/><text x="861" y="278" fill="#c8fa77" font-family="monospace" font-size="15">$</text><text x="882" y="278" fill="#f0f7f2" font-family="monospace" font-size="15" font-weight="700">NVDA</text>
    <rect x="1160" y="251" width="289" height="43" rx="8" fill="#0b1114" stroke="#33464a"/><text x="1180" y="278" fill="#8e9da2" font-family="monospace" font-size="13">▣</text><text x="1204" y="278" fill="#f0f7f2" font-size="13">Oct 14, 2026</text>
    <text x="845" y="319" fill="#5d6b70" font-family="monospace" font-size="10">TRY</text><rect x="883" y="306" width="40" height="20" rx="5" fill="#233126" stroke="#52734d"/><text x="894" y="320" fill="#c8fa77" font-family="monospace" font-size="10">NVDA</text><rect x="931" y="306" width="39" height="20" rx="5" fill="#0b1114" stroke="#33464a"/><text x="941" y="320" fill="#8e9da2" font-family="monospace" font-size="10">AAPL</text><rect x="978" y="306" width="37" height="20" rx="5" fill="#0b1114" stroke="#33464a"/><text x="988" y="320" fill="#8e9da2" font-family="monospace" font-size="10">SPY</text>
    <text x="845" y="350" fill="#b7c6c6" font-size="11">Research lenses</text><text x="1355" y="350" fill="#69d7c1" font-size="11">Clear all</text>
    <rect x="845" y="362" width="140" height="38" rx="7" fill="#1c2a24" stroke="#66845a"/><text x="865" y="386" fill="#c8fa77" font-size="11">↗  Market</text><rect x="996" y="362" width="140" height="38" rx="7" fill="#1c2a24" stroke="#66845a"/><text x="1016" y="386" fill="#c8fa77" font-size="11">⌁  Sentiment</text><rect x="1147" y="362" width="140" height="38" rx="7" fill="#1c2a24" stroke="#66845a"/><text x="1167" y="386" fill="#c8fa77" font-size="11">◎  News</text><rect x="1298" y="362" width="151" height="38" rx="7" fill="#1c2a24" stroke="#66845a"/><text x="1318" y="386" fill="#c8fa77" font-size="11">◈  Fundamentals</text>

    <rect x="845" y="420" width="603" height="44" rx="7" fill="url(#button)"/><text x="1084" y="448" fill="#10180b" font-size="12" font-weight="700">▶  Start analysis                                      ↗</text>

    <rect x="79" y="474" width="140" height="92" rx="12" fill="#11191d" stroke="#283a3d"/><text x="99" y="503" fill="#c8fa77" font-size="17">◉</text><text x="99" y="532" fill="#f0f7f2" font-size="14" font-weight="600">See the reasoning,</text><text x="99" y="551" fill="#8e9da2" font-size="14">not just the rating.</text>
    <rect x="237" y="474" width="308" height="92" rx="12" fill="#11191d" stroke="#283a3d"/><text x="258" y="499" fill="#8e9da2" font-family="monospace" font-size="10">DECISION QUALITY LOOP</text><text x="258" y="537" fill="#c8fa77" font-family="monospace" font-size="10">log  →  settle  →  reflect  →  inject</text><rect x="258" y="517" width="255" height="3" rx="2" fill="#2b3e42"/><rect x="258" y="517" width="177" height="3" rx="2" fill="url(#chart)"/>

    <text x="79" y="636" fill="#68d7c1" font-family="monospace" font-size="10" letter-spacing="1.7">THE RESEARCH LOOP</text><text x="79" y="674" fill="#f0f7f2" font-size="26" font-weight="600">From raw signal to considered stance.</text>
    <line x1="79" y1="704" x2="1484" y2="704" stroke="#26353a"/>
    <g fill="#8e9da2" font-size="12"><text x="79" y="742" fill="#5d6b70" font-family="monospace">01</text><text x="79" y="779" fill="#f0f7f2" font-size="17" font-weight="600">Investigate</text><text x="79" y="806">Independent lenses</text><text x="79" y="824">gather evidence.</text><text x="545" y="742" fill="#5d6b70" font-family="monospace">02</text><text x="545" y="779" fill="#f0f7f2" font-size="17" font-weight="600">Challenge</text><text x="545" y="806">Debates pressure-test</text><text x="545" y="824">the story.</text><text x="1010" y="742" fill="#5d6b70" font-family="monospace">03</text><text x="1010" y="779" fill="#f0f7f2" font-size="17" font-weight="600">Decide</text><text x="1010" y="806">One accountable</text><text x="1010" y="824">final call.</text></g>
    <path d="M79 852H1484" stroke="#26353a"/>
    <text x="79" y="896" fill="#68d7c1" font-family="monospace" font-size="10" letter-spacing="1.7">WORKSPACE HISTORY</text><text x="79" y="930" fill="#f0f7f2" font-size="24" font-weight="600">Recent runs</text>
    <rect x="79" y="950" width="1405" height="1" fill="#26353a"/>
  </g>
  <path d="M810 127h670" stroke="#c8fa77" stroke-opacity=".6"/>
</svg>
