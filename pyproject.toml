[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeagent-plus"
version = "0.1.0"
description = "Multi-agent LLM financial trading framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.4",
    "pandas>=2.0",
    "pydantic>=2.5",
    "python-dateutil>=2.8",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "rich>=13.0",
    "stockstats>=0.6",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-subtests>=0.13", "ruff>=0.6", "httpx>=0.27"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sse-starlette>=2.0"]
observability = ["langfuse>=3.0"]


[tool.setuptools.packages.find]
include = ["tradeagents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
combine-as-imports = true
